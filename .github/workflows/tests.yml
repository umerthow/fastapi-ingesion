name: Tests

on:
  push:
    branches: [ main, develop, integration_test ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customers_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
    
    - name: Start Flask Mock Server
      run: |
        cd mock-server
        pip install -r requirements.txt
        nohup python app.py > flask.log 2>&1 &
        echo $! > flask.pid
      env:
        FLASK_PORT: 5000
    
    - name: Wait for Flask to be ready
      run: |
        for i in {1..30}; do
          if curl -s http://localhost:5000/api/health > /dev/null; then
            echo "Flask is ready!"
            break
          fi
          echo "Waiting for Flask... ($i/30)"
          sleep 2
        done
    
    - name: Start FastAPI Pipeline Service
      run: |
        cd pipeline-service
        pip install -r requirements.txt
        nohup uvicorn main:app --host 0.0.0.0 --port 8000 > fastapi.log 2>&1 &
        echo $! > fastapi.pid
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: customers_db
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        FLASK_URL: http://localhost:5000
    
    - name: Wait for FastAPI to be ready
      run: |
        for i in {1..30}; do
          if curl -s http://localhost:8000/api/health > /dev/null; then
            echo "FastAPI is ready!"
            break
          fi
          echo "Waiting for FastAPI... ($i/30)"
          sleep 2
        done
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Display logs on failure
      if: failure()
      run: |
        echo "=== Flask logs ==="
        cat mock-server/flask.log || echo "No Flask logs"
        echo "=== FastAPI logs ==="
        cat pipeline-service/fastapi.log || echo "No FastAPI logs"
