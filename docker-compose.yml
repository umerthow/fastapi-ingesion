version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-customers_db}
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Flask Mock Server
  mock-server:
    build:
      context: ./mock-server
      dockerfile: Dockerfile
    container_name: flask_mock_server
    ports:
      - "${FLASK_PORT:-5001}:5000"
    volumes:
      - ./mock-server/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  # FastAPI Pipeline Service
  pipeline-service:
    build:
      context: ./pipeline-service
      dockerfile: Dockerfile
    container_name: fastapi_pipeline
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MOCK_SERVER_URL: ${MOCK_SERVER_URL}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      mock-server:
        condition: service_started
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
